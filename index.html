<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            object-fit: cover;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(255, 255, 255, 0.85);
        }

        .strip {
            position: fixed;
            left: 0;
            right: 0;
            height: 18vh;
            background: #ffffff;
            z-index: -1;
            border-left: 4px solid #000;
            border-right: 4px solid #000;
        }

        .strip.top {
            top: 0;
            border-bottom: 4px solid #000;
        }

        .strip.bottom {
            bottom: 0;
            border-top: 4px solid #000;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            border: 4px solid #000;
            background: #ffffff;
            padding: 20px 40px;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 900px;
        }

        .card {
            border: 4px solid #000;
            padding: 30px 35px;
            width: 380px;
            text-decoration: none;
            color: #000;
            background: rgba(255, 255, 255, 0.9);
            transition: background 0.2s, transform 0.15s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            background: #000;
            color: #fff;
            transform: translateY(-4px);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: 400;
        }

        .card-arrow {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: auto;
        }

        .card:hover .card-arrow {
            color: #fff;
        }

        footer {
            margin-top: auto;
            padding-top: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-top: 2px solid #000;
            width: 100%;
            max-width: 900px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="video/background.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="strip top"></div>
    <div class="strip bottom"></div>

    <h1>Мои проекты</h1>

    <div class="cards">
        <a class="card" href="https://vadimgrr.github.io/meeting-notes/" target="_blank">
            <span class="card-title">Живой конспект встречи</span>
            <span class="card-desc">Голосовой ввод в реальном времени с AI-генерацией конспекта встречи.</span>
            <span class="card-arrow">→ Открыть</span>
        </a>

        <div class="card" style="opacity: 0.4; pointer-events: none;">
            <span class="card-title">Скоро</span>
            <span class="card-desc">Новый проект будет добавлен сюда.</span>
            <span class="card-arrow">→ Скоро</span>
        </div>
    </div>

    <footer>2026</footer>
</body>
</html>
